[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "network-lab-factory"
version = "0.1.0"
description = "Compile validated network scenarios into EVE-NG labs and Ansible inventories."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Carlos Alvarado"}]
dependencies = ["PyYAML>=6.0.2,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.14,<1"]
ansible = ["ansible-core>=2.19,<2.20", "paramiko>=3,<4"]

[project.scripts]
nlf = "netlab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
