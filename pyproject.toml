[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "network-lab-factory"
version = "0.3.0rc1"
description = "Prepare and verify repeatable EVE-NG and GNS3 labs through a guided terminal."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Carlos Alvarado"}]
dependencies = ["PyYAML>=6.0.2,<7", "textual>=8.2.8,<9", "paramiko>=3.5,<5"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.14,<1"]
ansible = ["ansible-core>=2.19,<2.20", "paramiko>=3,<4"]

[project.scripts]
nlf = "netlab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
netlab = ["*.tcss", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
